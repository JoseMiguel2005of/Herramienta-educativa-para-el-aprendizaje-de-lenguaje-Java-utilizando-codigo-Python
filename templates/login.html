{% extends "base.html" %}

{% block title %}Iniciar Sesión — {{ t.site_title }}{% endblock %}

{% block content %}
<article class="login-page" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="login-container" style="background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 2rem; width: 100%; max-width: 400px; box-shadow: var(--shadow-lg);">
        <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--green);">Iniciar Sesión</h2>
        
        {% if error %}
        <div style="background: rgba(239, 83, 80, 0.1); border: 1px solid #ef5350; color: #ef5350; padding: 0.8rem; border-radius: 4px; margin-bottom: 1.5rem; text-align: center;">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('login') }}" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <label for="username" style="display: block; margin-bottom: 0.5rem; color: var(--text);">Usuario</label>
                <input type="text" id="username" name="username" required style="width: 100%; padding: 0.8rem; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-code); color: var(--text); outline: none; font-family: inherit;">
            </div>
            
            <div>
                <label for="password" style="display: block; margin-bottom: 0.5rem; color: var(--text);">Contraseña</label>
                <input type="password" id="password" name="password" required style="width: 100%; padding: 0.8rem; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-code); color: var(--text); outline: none; font-family: inherit;">
            </div>
            
            <button type="submit" class="btn-translate" style="background: var(--green); color: #fff; border: none; padding: 0.8rem; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 0.5rem; font-size: 1.1rem;">
                Entrar
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            ¿No tienes cuenta? <a href="{{ url_for('register') }}" style="color: var(--green); text-decoration: none;">Regístrate</a>
        </div>
    </div>
</article>
{% endblock %}
