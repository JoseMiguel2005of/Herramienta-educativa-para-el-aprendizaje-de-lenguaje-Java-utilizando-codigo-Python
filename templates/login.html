{% extends "base.html" %}

{% block title %}Iniciar Sesión — {{ t.site_title }}{% endblock %}

{% block content %}
<article class="login-page" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="login-container" style="background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 2rem; width: 100%; max-width: 400px; box-shadow: var(--shadow-lg);">
        <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--green);">Iniciar Sesión</h2>
        
        {% if error %}
        <div role="alert" class="alert-inclusive alert-inclusive--danger">
            <span aria-hidden="true">⚠</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        {% if success %}
        <div role="status" class="alert-inclusive alert-inclusive--success">
            <span aria-hidden="true">✓</span>
            <span>{{ success }}</span>
        </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('login') }}" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <label for="username" style="display: block; margin-bottom: 0.45rem; color: var(--text); font-weight: 600;">Usuario</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="Tu usuario..." style="width: 100%; min-height: 44px; padding: 0.75rem 0.9rem; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg-code); color: var(--text); font-family: inherit;">
            </div>
            
            <div>
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.25rem 0.75rem; margin-bottom: 0.45rem;">
                    <label for="password" style="color: var(--text); margin: 0; font-weight: 600;">Contraseña</label>
                    <a href="{{ url_for('forgot_password') }}" style="font-size: 0.85rem; color: var(--green); text-decoration: underline;">¿Olvidaste tu contraseña o usuario?</a>
                </div>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Tu contraseña..." style="width: 100%; min-height: 44px; padding: 0.75rem 0.9rem; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg-code); color: var(--text); font-family: inherit;">
            </div>
            
            <button type="submit" class="btn-primary-inclusive" style="width: 100%; margin-top: 0.5rem; font-size: 1.02rem;">
                Entrar
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            ¿No tienes cuenta? <a href="{{ url_for('register') }}" style="color: var(--green); text-decoration: none; font-weight: bold;">Regístrate</a>
        </div>
    </div>
</article>
{% endblock %}
