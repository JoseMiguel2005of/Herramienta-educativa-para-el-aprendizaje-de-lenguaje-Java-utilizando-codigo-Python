{% extends "base.html" %}

{% block title %}Registro — {{ t.site_title }}{% endblock %}

{% block content %}
<article class="login-page" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="login-container" style="background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 2rem; width: 100%; max-width: 400px; box-shadow: var(--shadow-lg);">
        <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--green);">Crear Cuenta</h2>
        
        {% if error %}
        <div role="alert" class="alert-inclusive alert-inclusive--danger">
            <span aria-hidden="true">⚠</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('register') }}" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <label for="username" style="display: block; margin-bottom: 0.45rem; color: var(--text); font-weight: 600;">Usuario</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="Tu nombre de usuario..." style="width: 100%; min-height: 44px; padding: 0.75rem 0.9rem; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg-code); color: var(--text); font-family: inherit;">
            </div>

            <div>
                <label for="email" style="display: block; margin-bottom: 0.45rem; color: var(--text); font-weight: 600;">Correo Electrónico</label>
                <input type="email" id="email" name="email" required autocomplete="email" placeholder="tu@correo.com" style="width: 100%; min-height: 44px; padding: 0.75rem 0.9rem; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg-code); color: var(--text); font-family: inherit;">
            </div>
            
            <div>
                <label for="password" style="display: block; margin-bottom: 0.45rem; color: var(--text); font-weight: 600;">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Tu contraseña..." style="width: 100%; min-height: 44px; padding: 0.75rem 0.9rem; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg-code); color: var(--text); font-family: inherit;">
            </div>
            
            <div>
                <label for="role" style="display: block; margin-bottom: 0.45rem; color: var(--text); font-weight: 600;">Soy...</label>
                <select id="role" name="role" onchange="toggleTeacherCode(this.value)" style="width: 100%; min-height: 44px; padding: 0.75rem 0.9rem; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg-code); color: var(--text); font-family: inherit;">
                    <option value="student">Estudiante</option>
                    <option value="teacher">Profesor</option>
                </select>
            </div>

            <div id="student-class-field">
                <label for="class_code" style="display: block; margin-bottom: 0.45rem; color: var(--text); font-weight: 600;">
                    Código de Clase / Sección <span style="font-size: 0.82rem; font-weight: 400; color: var(--text-muted);">(opcional)</span>
                    <span style="font-size: 0.82rem; font-weight: 400; color: var(--text-muted); display: block;">Si tu profesor te dio un código (ej. PROG-7K2M), ingrésalo aquí</span>
                </label>
                <input type="text" id="class_code" name="class_code" maxlength="20" placeholder="Ej. PROG-7K2M" style="width: 100%; min-height: 44px; padding: 0.75rem 0.9rem; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg-code); color: var(--text); font-family: var(--font-mono); text-transform: uppercase;">
            </div>

            <div id="teacher-code-field" style="display: none;">
                <label for="teacher_code" style="display: block; margin-bottom: 0.45rem; color: var(--text); font-weight: 600;">
                    Código de Profesor
                    <span style="font-size: 0.82rem; font-weight: 400; color: var(--text-muted); display: block;">Ingresa el código secreto proporcionado por el Super Admin</span>
                </label>
                <input type="password" id="teacher_code" name="teacher_code" placeholder="Código secreto..." style="width: 100%; min-height: 44px; padding: 0.75rem 0.9rem; border-radius: 8px; border: 1px solid var(--status-warning-border); background: var(--status-warning-bg); color: var(--text); font-family: inherit;">
            </div>
            
            <button type="submit" class="btn-primary-inclusive" style="width: 100%; margin-top: 0.5rem; font-size: 1.02rem;">
                Registrarme
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            ¿Ya tienes cuenta? <a href="{{ url_for('login') }}" style="color: var(--green); text-decoration: none;">Inicia sesión</a>
        </div>
    </div>
</article>

<script>
function toggleTeacherCode(value) {
    const teacherField = document.getElementById('teacher-code-field');
    const studentField = document.getElementById('student-class-field');
    if (value === 'teacher') {
        teacherField.style.display = 'block';
        teacherField.style.animation = 'slideDown 0.3s ease';
        if (studentField) studentField.style.display = 'none';
    } else {
        teacherField.style.display = 'none';
        if (studentField) studentField.style.display = 'block';
    }
}
</script>
{% endblock %}
