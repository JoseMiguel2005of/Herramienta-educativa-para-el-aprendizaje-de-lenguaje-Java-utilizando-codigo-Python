{% extends "base.html" %}

{% block title %}Registro — {{ t.site_title }}{% endblock %}

{% block content %}
<article class="login-page" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="login-container" style="background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 2rem; width: 100%; max-width: 400px; box-shadow: var(--shadow-lg);">
        <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--green);">Crear Cuenta</h2>
        
        {% if error %}
        <div style="background: rgba(239, 83, 80, 0.1); border: 1px solid #ef5350; color: #ef5350; padding: 0.8rem; border-radius: 4px; margin-bottom: 1.5rem; text-align: center;">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('register') }}" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <label for="username" style="display: block; margin-bottom: 0.5rem; color: var(--text);">Usuario</label>
                <input type="text" id="username" name="username" required placeholder="Tu nombre de usuario..." style="width: 100%; padding: 0.8rem; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-code); color: var(--text); outline: none; font-family: inherit;">
            </div>

            <div>
                <label for="email" style="display: block; margin-bottom: 0.5rem; color: var(--text);">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="tu@correo.com" style="width: 100%; padding: 0.8rem; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-code); color: var(--text); outline: none; font-family: inherit;">
            </div>
            
            <div>
                <label for="password" style="display: block; margin-bottom: 0.5rem; color: var(--text);">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="Tu contraseña..." style="width: 100%; padding: 0.8rem; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-code); color: var(--text); outline: none; font-family: inherit;">
            </div>
            
            <div>
                <label for="role" style="display: block; margin-bottom: 0.5rem; color: var(--text);">Soy...</label>
                <select id="role" name="role" onchange="toggleTeacherCode(this.value)" style="width: 100%; padding: 0.8rem; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-code); color: var(--text); outline: none; font-family: inherit;">
                    <option value="student">Estudiante</option>
                    <option value="teacher">Profesor</option>
                </select>
            </div>

            <div id="student-class-field">
                <label for="class_code" style="display: block; margin-bottom: 0.5rem; color: var(--text);">
                    Código de Clase / Sección <span style="font-size: 0.75rem; color: var(--text-muted);">(opcional)</span>
                    <span style="font-size: 0.75rem; color: var(--text-muted); display: block;">Si tu profesor te dio un código (ej. PROG-7K2M), ingrésalo aquí</span>
                </label>
                <input type="text" id="class_code" name="class_code" maxlength="20" placeholder="Ej. PROG-7K2M" style="width: 100%; padding: 0.8rem; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-code); color: var(--text); outline: none; font-family: 'JetBrains Mono', monospace; text-transform: uppercase;">
            </div>

            <div id="teacher-code-field" style="display: none;">
                <label for="teacher_code" style="display: block; margin-bottom: 0.5rem; color: var(--text);">
                    Código de Profesor
                    <span style="font-size: 0.75rem; color: var(--text-muted); display: block;">Ingresa el código secreto proporcionado por el Super Admin</span>
                </label>
                <input type="password" id="teacher_code" name="teacher_code" placeholder="Código secreto..." style="width: 100%; padding: 0.8rem; border-radius: 4px; border: 1px solid rgba(255,152,0,0.4); background: rgba(255,152,0,0.05); color: var(--text); outline: none; font-family: inherit;">
            </div>
            
            <button type="submit" class="btn-translate" style="background: var(--python-color); color: #fff; border: none; padding: 0.8rem; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 0.5rem; font-size: 1.1rem;">
                Registrarme
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            ¿Ya tienes cuenta? <a href="{{ url_for('login') }}" style="color: var(--green); text-decoration: none;">Inicia sesión</a>
        </div>
    </div>
</article>

<script>
function toggleTeacherCode(value) {
    const teacherField = document.getElementById('teacher-code-field');
    const studentField = document.getElementById('student-class-field');
    if (value === 'teacher') {
        teacherField.style.display = 'block';
        teacherField.style.animation = 'slideDown 0.3s ease';
        if (studentField) studentField.style.display = 'none';
    } else {
        teacherField.style.display = 'none';
        if (studentField) studentField.style.display = 'block';
    }
}
</script>
{% endblock %}
