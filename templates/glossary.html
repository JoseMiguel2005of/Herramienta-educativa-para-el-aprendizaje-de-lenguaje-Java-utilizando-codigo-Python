{% extends "base.html" %}

{% block title %}Glosario — Py2Java Edu{% endblock %}

{% block content %}
<article class="telemetry-dashboard">
    <header class="telemetry-header">
        <h1 style="display:flex; align-items:center; gap:0.75rem;">
            <div class="neu-icon-box">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            </div>
            GLOSARIO
        </h1>
        <div class="system-status">
            <span class="status-indicator"></span>
            TERMINOLOGY_INDEX
        </div>
    </header>

    <!-- Search -->
    <div class="glossary-search-box">
        <span style="color: var(--green);">>_</span>
        <input type="text" id="glossary-search" placeholder="Buscar término..." class="glossary-search-input" autofocus>
    </div>

    <div class="glossary-grid" id="glossary-grid">
        <!-- Terms will be populated by JS -->
    </div>

    <div id="glossary-empty" style="display:none; text-align: center; padding: 3rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace;">
        // Sin resultados para la búsqueda
    </div>
</article>

<style>
.glossary-search-box {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--bg-code);
    border: 1px solid var(--border);
    padding: 0.6rem 1rem;
    margin-bottom: 1.5rem;
    font-family: 'JetBrains Mono', monospace;
}

.glossary-search-input {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    width: 100%;
    outline: none;
}

.glossary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 0.75rem;
}

.glossary-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1rem 1.25rem;
    transition: all 0.2s ease;
    font-family: 'JetBrains Mono', monospace;
}

.glossary-card:hover {
    border-color: var(--green);
    background: rgba(0, 229, 255, 0.03);
    transform: translateY(-1px);
}

.glossary-card-term {
    color: var(--green);
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 0.25rem;
    font-family: 'Space Grotesk', sans-serif;
}

.glossary-card-alt {
    color: var(--text-muted);
    font-size: 0.7rem;
    margin-bottom: 0.5rem;
}

.glossary-card-def {
    color: var(--text);
    font-size: 0.82rem;
    line-height: 1.5;
    font-family: 'Inter', sans-serif;
}

.glossary-card-tags {
    margin-top: 0.5rem;
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
}

.glossary-tag {
    background: rgba(0, 229, 255, 0.08);
    border: 1px solid rgba(0, 229, 255, 0.2);
    color: var(--green);
    padding: 0.1rem 0.4rem;
    border-radius: 2px;
    font-size: 0.65rem;
    letter-spacing: 0.03em;
}

@media (max-width: 600px) {
    .glossary-grid {
        grid-template-columns: 1fr;
    }
}
</style>

<script>
const GLOSSARY = typeof GLOSSARY_MASTER !== 'undefined' ? GLOSSARY_MASTER : [
    { term: 'Variable', alt: 'variable', def: 'Nombre que almacena un dato en memoria.', tags: ['básico', 'python', 'java'] }
];

function renderGlossary(filter = '') {
    const grid = document.getElementById('glossary-grid');
    const empty = document.getElementById('glossary-empty');
    const lowerFilter = filter.toLowerCase().trim();

    const filtered = GLOSSARY.filter(g =>
        g.term.toLowerCase().includes(lowerFilter) ||
        (g.alt && g.alt.toLowerCase().includes(lowerFilter)) ||
        g.def.toLowerCase().includes(lowerFilter) ||
        (g.tags && g.tags.some(t => t.toLowerCase().includes(lowerFilter)))
    );

    if (filtered.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'block';
        return;
    }

    grid.style.display = '';
    empty.style.display = 'none';

    grid.innerHTML = filtered.map(g => `
        <div class="glossary-card">
            <div class="glossary-card-term">${g.term}</div>
            <div class="glossary-card-alt">${g.alt || ''}</div>
            <div class="glossary-card-def">${g.def}</div>
            <div class="glossary-card-tags">
                ${(g.tags || []).map(t => `<span class="glossary-tag">${t}</span>`).join('')}
            </div>
        </div>
    `).join('');
}

document.getElementById('glossary-search').addEventListener('input', (e) => {
    renderGlossary(e.target.value);
});

renderGlossary();
</script>
{% endblock %}
