<div class="quiz-reorder">
    <p class="reorder-instruction">Arrastra las líneas para ordenarlas correctamente.</p>
    <ul class="reorder-list" id="reorder-list-{{ ex.id }}">
        {% for line_index in ex.shuffled_order %}
        <li class="reorder-item" draggable="true" data-original-index="{{ line_index }}">
            <span class="drag-handle">☰</span>
            <code class="language-java">{{ ex.lines[line_index] }}</code>
        </li>
        {% endfor %}
    </ul>
    <div class="quiz-answer-data" data-correct-count="{{ ex.lines | length }}" hidden></div>
</div>
